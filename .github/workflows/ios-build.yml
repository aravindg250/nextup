# Builds an unsigned NextUp.ipa on a GitHub-hosted Mac.
# Run it from the repo's Actions tab ("Run workflow"), then download the
# NextUp-ipa artifact and install it with AltStore on Windows, which signs it
# with your Apple ID.

name: iOS build

on:
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -workspace ios/NextUp.xcworkspace \
            -scheme NextUp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > xcodebuild.log 2>&1 || { tail -n 80 xcodebuild.log; exit 1; }
          tail -n 5 xcodebuild.log

      - name: Package NextUp.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NextUp.app Payload/
          zip -qry NextUp.ipa Payload
          ls -lh NextUp.ipa

      - name: Upload NextUp.ipa
        uses: actions/upload-artifact@v4
        with:
          name: NextUp-ipa
          path: NextUp.ipa
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
